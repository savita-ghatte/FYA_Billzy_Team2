{% extends "base.html" %}
{% block title %}My Profile | Billzy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">My Profile</h3>
                        <p class="text-muted mb-0">Manage your account details and update your password.</p>
                    </div>
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:56px; height:56px; font-size:24px;">
                        <i class="bi bi-person-circle"></i>
                    </div>
                </div>

                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Role</label>
                            <input type="text" class="form-control" value="{{ current_user.role.replace('_', ' ').title() }}" disabled>
                        </div>
                        <div class="col-12">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password">
                        </div>
                    </div>

                    {% if shop %}
                    <div class="mt-4 border-top pt-4">
                        <h5 class="fw-semibold">Shop Information</h5>
                        <div class="row g-3 mt-1">
                            <div class="col-md-6">
                                <label class="form-label">Shop Name</label>
                                <input type="text" class="form-control" value="{{ shop.name }}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" value="{{ shop.state }}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">GSTIN</label>
                                <input type="text" class="form-control" value="{{ shop.gstin or '' }}" disabled>
                            </div>
                        </div>
                    </div>
                    {% endif %}

                    <div class="mt-4 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
