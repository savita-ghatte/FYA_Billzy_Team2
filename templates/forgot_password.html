{% extends "base.html" %}
{% block title %}Forgot Password | Billzy{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-lg-5">
                <h2 class="fw-bold mb-2">Forgot Password?</h2>
                <p class="text-muted mb-4">
                    Enter your email and we’ll guide you through the recovery process.
                </p>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name="new_password"
                            placeholder="Enter a new password"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name="confirm_password"
                            placeholder="Re-enter the new password"
                            required
                        >
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary" type="submit">
                            Reset Password
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
